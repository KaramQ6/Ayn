<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>عين — الخاتمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../deck.css">
<style>
  .closing {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-bottom: 50px;
  }
  .closing h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 110px;
    line-height: 1.4;
    margin-top: 30px;
  }
  .closing p {
    margin-top: 30px;
    font-size: 30px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.8;
    max-width: 1100px;
  }
  .cta {
    display: flex;
    gap: 20px;
    margin-top: 60px;
    align-items: center;
  }
  .cta .chip { font-size: 23px; padding: 14px 30px; }
  .cta .gh { direction: ltr; font-weight: 400; color: var(--text); }
  .thanks {
    position: absolute;
    right: 120px; left: 120px; bottom: 58px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    font-size: 21px;
    color: var(--faint);
  }
  .thanks .word { font-family: var(--font-display); font-weight: 600; font-size: 26px; color: var(--text); }
  .thanks .word span { color: var(--accent); }
</style>
</head>
<body>
<div class="stage">
<section class="slide">
  <div class="closing">

    <svg width="380" height="170" viewBox="0 0 560 250" fill="none">
      <defs>
        <radialGradient id="iris2" cx="50%" cy="42%" r="62%">
          <stop offset="0%" stop-color="#FFB257"/>
          <stop offset="55%" stop-color="#FF5C33"/>
          <stop offset="100%" stop-color="#C93A18"/>
        </radialGradient>
        <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="26"/>
        </filter>
      </defs>
      <circle cx="280" cy="125" r="78" fill="#FF5C33" opacity=".16" filter="url(#soft2)"/>
      <path d="M30 125 C 140 18, 420 18, 530 125" stroke="rgba(242,237,227,.85)" stroke-width="2.5"/>
      <path d="M30 125 C 140 232, 420 232, 530 125" stroke="rgba(242,237,227,.32)" stroke-width="2"/>
      <circle cx="280" cy="125" r="56" fill="url(#iris2)"/>
      <circle cx="280" cy="125" r="21" fill="#06080F" opacity=".88"/>
      <circle cx="299" cy="106" r="7" fill="rgba(242,237,227,.92)"/>
      <ellipse cx="280" cy="125" rx="252" ry="78" stroke="rgba(242,237,227,.18)" stroke-width="1" transform="rotate(-8 280 125)"/>
      <circle cx="497" cy="68" r="9" fill="rgba(65,201,212,.25)"/>
      <circle cx="497" cy="68" r="4.5" fill="#41C9D4"/>
    </svg>

    <h1>الأرض تستحق<br><span class="accent">من يراقبها.</span></h1>

    <p>عين — منصة مفتوحة المصدر، تعمل اليوم، وجاهزة للعرض الحي أمامكم خلال دقائق.</p>

    <div class="cta">
      <span class="chip gh">github.com/KaramQ6/Ayn</span>
      <span class="chip live"><span class="dot"></span>عرض حي متاح</span>
    </div>

  </div>

  <div class="thanks">
    <div class="word">شكراً <span>لكم</span></div>
    <div>Astro Code 2026 · هاكاثون &nbsp;·&nbsp; 15 / 15</div>
  </div>
</section>
</div>
<script src="../deck-scale.js"></script>
</body>
</html>
