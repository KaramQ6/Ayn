<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>عين — لوحة العمليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../deck.css">
<style>
  .hero {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .veil {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(4,6,12,.96) 0%, rgba(4,6,12,.55) 26%, rgba(4,6,12,0) 55%),
      linear-gradient(to bottom, rgba(4,6,12,.5) 0%, rgba(4,6,12,0) 18%);
  }
  .overlay {
    position: absolute;
    right: 120px; left: 120px; bottom: 84px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .overlay .kicker { margin-bottom: 20px; }
  .overlay h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 62px;
    line-height: 1.35;
  }
  .overlay p {
    margin-top: 16px;
    font-size: 26px;
    font-weight: 300;
    color: var(--muted);
    max-width: 980px;
    line-height: 1.7;
  }
  .overlay .page {
    direction: ltr;
    font-size: 19px;
    letter-spacing: .18em;
    color: var(--faint);
    font-weight: 300;
    padding-bottom: 8px;
  }
</style>
</head>
<body>
<div class="stage">
<section class="slide">
  <img class="hero" src="../assets/dashboard.png" alt="لوحة العمليات الحية">
  <div class="veil"></div>

  <div class="overlay">
    <div>
      <div class="kicker">
        <span class="no">06</span><span class="rule"></span><span class="label">المنتج</span>
      </div>
      <h2>كل التهديدات… في <span class="accent">شاشة واحدة</span></h2>
      <p>خريطة تكتيكية حية تتدفق إليها الإنذارات لحظياً عبر WebSocket — مع فلترة بحسب الدولة، وواجهة كاملة بثلاث لغات.</p>
    </div>
    <div class="page">07 / 15</div>
  </div>
</section>
</div>
<script src="../deck-scale.js"></script>
</body>
</html>
