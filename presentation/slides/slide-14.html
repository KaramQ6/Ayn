<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>عين — الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../deck.css">
<style>
  /*
    ── كيف تضيف صور الفريق؟ ──────────────────────────────
    ضَع الصور في المجلد:  presentation/assets/team/
    بالأسماء:            member-1.jpg … member-5.jpg
    وستظهر تلقائياً مكان المربعات الرمادية.
    لإضافة عضو سادس: انسخ أي بطاقة <div class="member">.
    ثم عدّل الاسم والدور في كل بطاقة بالأسفل.
    ──────────────────────────────────────────────────────
  */
  .team {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 44px;
    margin-top: 70px;
  }
  .member { text-align: center; }
  .photo {
    position: relative;
    height: 360px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    background:
      radial-gradient(240px 200px at 50% 30%, rgba(255,92,51,.07), transparent 70%),
      var(--bg-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .photo svg { opacity: .35; }
  .photo .hint { font-size: 19px; font-weight: 300; color: var(--faint); }
  .photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .member h4 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 28px;
    margin-top: 26px;
  }
  .member .role { font-size: 20px; font-weight: 300; color: var(--muted); margin-top: 8px; }
  .member .tick { width: 34px; height: 2px; background: var(--accent); margin: 18px auto 0; border-radius: 1px; }
</style>
</head>

<div class="stage">
<section class="slide">

            <circle cx="37" cy="20" r="8" fill="#FF5C33"/>
